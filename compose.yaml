services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      zitadel:
        condition: service_healthy
    command: ["uvicorn", "app.core.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    security_opt:
      - no-new-privileges:true
    develop:
      watch:
        - action: sync
          path: .
          target: /app
          ignore:
            - .venv/
        - action: rebuild
          path: ./pyproject.toml
    volumes:
      - ./.zitadel-bootstrap:/run/zitadel-bootstrap
      - ./scripts:/app/scripts:ro

  # ----------------------------------------------------------------------
  # Background worker (arq) — shares the app image, not the request path
  #
  # Same env file, same network, same image as `app`.  No exposed ports:
  # the worker consumes jobs from Redis; it does not serve anything.
  #
  # depends_on: only Postgres and Redis.  The worker has no JWT validation
  # path and never calls Zitadel, so depending on it would add ~60 s to
  # every cold start for no benefit.
  #
  # stop_grace_period: must match WorkerSettings.job_timeout (300 s).
  # `docker compose stop worker` sends SIGTERM; arq stops pulling new jobs
  # and waits for in-flight ones to finish.  Without the extended grace
  # period Docker escalates to SIGKILL after 10 s and leaves a scan row
  # half-written.  Stopping the worker leaves the API healthy and jobs
  # queued — the two processes fail independently.
  # ----------------------------------------------------------------------

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    command: ["python", "-m", "app.worker"]
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    stop_grace_period: 300s
    security_opt:
      - no-new-privileges:true
    develop:
      watch:
        - action: sync
          path: .
          target: /app
          ignore:
            - .venv/
        - action: rebuild
          path: ./pyproject.toml

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  test-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_password
      POSTGRES_DB: test_db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test_user -d test_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    security_opt:
      - no-new-privileges:true

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD}
    environment:
      # redis-cli reads REDISCLI_AUTH instead of needing `-a <pw>` on the
      # command line, where the password would be visible in process
      # listings (docker inspect, /proc/*/cmdline).
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  # ----------------------------------------------------------------------
  # Identity (Zitadel) — local IdP for ADR-0002
  #
  # Zitadel gets its own Postgres instance (zitadel-db), never the app's.
  # Its schema is Zitadel's to migrate; ours must never touch it, and vice
  # versa. See docs/zitadel-local.md for the full walkthrough, the issuer
  # trap, and the console steps to create a project/roles/app.
  # ----------------------------------------------------------------------

  zitadel-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${ZITADEL_DB_USER}
      POSTGRES_PASSWORD: ${ZITADEL_DB_PASSWORD}
      POSTGRES_DB: ${ZITADEL_DB_NAME}
    volumes:
      - zitadel_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${ZITADEL_DB_USER} -d ${ZITADEL_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  zitadel:
    # Pinned, not :latest. v3.4.x is the pre-Login-V2 line: a single binary
    # with the classic embedded /ui/console and /ui/login, so this stays a
    # one-container identity service instead of pulling in the Traefik +
    # separate Next.js login-UI topology that ships by default from v4 on.
    # See docs/zitadel-local.md for the reasoning.
    image: ghcr.io/zitadel/zitadel:v3.4.15
    # The first-instance setup writes the Login Client PAT into the mounted
    # bootstrap volume. Run as root so this works on a fresh named volume;
    # the token remains available only to the two local Compose services.
    user: "0"
    # --tlsMode disabled (below) is dev-only: nothing here terminates TLS, so
    # this must never run reachable from outside your own machine. A real
    # deployment puts a TLS-terminating proxy in front of Zitadel and drops
    # this flag — see ZITADEL_EXTERNALSECURE/ZITADEL_TLS_ENABLED below too.
    command: >
      start-from-init
      --masterkey ${ZITADEL_MASTERKEY}
      --tlsMode disabled
    environment:
      ZITADEL_DATABASE_POSTGRES_HOST: zitadel-db
      ZITADEL_DATABASE_POSTGRES_PORT: 5432
      ZITADEL_DATABASE_POSTGRES_DATABASE: ${ZITADEL_DB_NAME}
      ZITADEL_DATABASE_POSTGRES_USER_USERNAME: ${ZITADEL_DB_USER}
      ZITADEL_DATABASE_POSTGRES_USER_PASSWORD: ${ZITADEL_DB_PASSWORD}
      ZITADEL_DATABASE_POSTGRES_USER_SSL_MODE: disable
      ZITADEL_DATABASE_POSTGRES_ADMIN_USERNAME: ${ZITADEL_DB_USER}
      ZITADEL_DATABASE_POSTGRES_ADMIN_PASSWORD: ${ZITADEL_DB_PASSWORD}
      ZITADEL_DATABASE_POSTGRES_ADMIN_SSL_MODE: disable
      # ZITADEL_EXTERNALDOMAIN is the compose service name, not "localhost".
      # This IS the issuer trap fix — see docs/zitadel-local.md. Every
      # container reaches Zitadel the same way a browser on the host does
      # (after a one-line /etc/hosts entry), so `iss` never disagrees with
      # itself depending on who's asking.
      ZITADEL_EXTERNALDOMAIN: zitadel
      ZITADEL_EXTERNALPORT: "8080"
      # Both "false" for the same dev-only reason as --tlsMode above: plain
      # HTTP, no certificate, fine on a laptop, never fine reachable from
      # anywhere else.
      ZITADEL_EXTERNALSECURE: "false"
      ZITADEL_TLS_ENABLED: "false"
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_USERNAME: ${ZITADEL_ADMIN_USERNAME}
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORD: ${ZITADEL_ADMIN_PASSWORD}
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_EMAIL_ADDRESS: ${ZITADEL_ADMIN_EMAIL}
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_EMAIL_VERIFIED: "true"
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORDCHANGEREQUIRED: "false"
      # First-instance IAM Owner service user for bootstrap automation.
      # Zitadel writes its PAT into the ignored local directory below so the
      # app container can read it. This is local-only identity bootstrap; do not
      # commit or expose the token.
      ZITADEL_FIRSTINSTANCE_PATPATH: /run/zitadel-bootstrap/admin.pat
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_MACHINE_USERNAME: zitadel-bootstrap
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_MACHINE_NAME: Zitadel Bootstrap
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_MACHINEKEY_TYPE: "1"
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_PAT_EXPIRATIONDATE: "2099-01-01T00:00:00Z"
      # ADR-0002 requires 15-minute access tokens; Zitadel's own default is
      # 12h. This is instance-level (applies org/project-wide, not settable
      # via a single app), and the four durations below must all be set
      # together or Zitadel errors at boot. See docs/zitadel-local.md.
      ZITADEL_DEFAULTINSTANCE_OIDCSETTINGS_ACCESSTOKENLIFETIME: 15m
      ZITADEL_DEFAULTINSTANCE_OIDCSETTINGS_IDTOKENLIFETIME: 15m
      ZITADEL_DEFAULTINSTANCE_OIDCSETTINGS_REFRESHTOKENIDLEEXPIRATION: 720h
      ZITADEL_DEFAULTINSTANCE_OIDCSETTINGS_REFRESHTOKENEXPIRATION: 2160h
    ports:
      - "8080:8080"
    depends_on:
      zitadel-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/app/zitadel", "ready"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./.zitadel-bootstrap:/run/zitadel-bootstrap

  # ----------------------------------------------------------------------
  # Target Lab Services (Isolated under the 'lab' profile)
  # Activated via: `just lab-up` (docker compose --profile lab up -d)
  # ----------------------------------------------------------------------

  lab-nginx:
    image: nginx:1.25.4-alpine
    profiles: ["lab"]
    ports:
      - "8081:80"
    volumes:
      - ./lab/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./lab/nginx/html:/usr/share/nginx/html:ro
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  lab-apache:
    image: httpd:2.4.52-alpine
    profiles: ["lab"]
    ports:
      - "8082:80"
    volumes:
      - ./lab/apache/httpd.conf:/usr/local/apache2/conf/httpd.conf:ro
      - ./lab/apache/html:/usr/local/apache2/htdocs:ro
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  lab-nonstandard:
    image: nginx:1.25.4-alpine
    profiles: ["lab"]
    ports:
      - "8888:8888"
    volumes:
      - ./lab/nonstandard/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./lab/nonstandard/html:/usr/share/nginx/html:ro
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  lab-tls-san:
    image: nginx:1.25.4-alpine
    profiles: ["lab"]
    ports:
      - "8443:443"
    volumes:
      - ./lab/tls/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./lab/tls/html:/usr/share/nginx/html:ro
      - ./lab/tls/certs:/etc/nginx/certs:ro
    networks:
      default:
        aliases:
          - target4.lab.local
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

volumes:
  postgres_data:
  redis_data:
  zitadel_db_data:
