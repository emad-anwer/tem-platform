services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["uvicorn", "app.core.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    security_opt:
      - no-new-privileges:true
    develop:
      watch:
        - action: sync
          path: .
          target: /app
          ignore:
            - .venv/
        - action: rebuild
          path: ./pyproject.toml

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD}
    environment:
      # redis-cli reads REDISCLI_AUTH instead of needing `-a <pw>` on the
      # command line, where the password would be visible in process
      # listings (docker inspect, /proc/*/cmdline).
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  # ----------------------------------------------------------------------
  # Target Lab Services (Isolated under the 'lab' profile)
  # Activated via: `just lab-up` (docker compose --profile lab up -d)
  # ----------------------------------------------------------------------

  lab-nginx:
    image: nginx:1.25.4-alpine
    profiles: ["lab"]
    ports:
      - "8081:80"
    volumes:
      - ./lab/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./lab/nginx/html:/usr/share/nginx/html:ro
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  lab-apache:
    image: httpd:2.4.52-alpine
    profiles: ["lab"]
    ports:
      - "8082:80"
    volumes:
      - ./lab/apache/httpd.conf:/usr/local/apache2/conf/httpd.conf:ro
      - ./lab/apache/html:/usr/local/apache2/htdocs:ro
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  lab-nonstandard:
    image: nginx:1.25.4-alpine
    profiles: ["lab"]
    ports:
      - "8888:8888"
    volumes:
      - ./lab/nonstandard/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./lab/nonstandard/html:/usr/share/nginx/html:ro
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  lab-tls-san:
    image: nginx:1.25.4-alpine
    profiles: ["lab"]
    ports:
      - "8443:443"
    volumes:
      - ./lab/tls/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./lab/tls/html:/usr/share/nginx/html:ro
      - ./lab/tls/certs:/etc/nginx/certs:ro
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

volumes:
  postgres_data:
  redis_data:
