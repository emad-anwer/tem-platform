server {
    listen 80;
    server_name localhost;

    # Explicit server banner for scanner banner-grabbing validation
    server_tokens on;

    # Simulated technology headers for fingerprinting validation
    add_header X-Powered-By "PHP/8.2.10" always;
    add_header X-Lab-Target "nginx-standard" always;

    location / {
        root /usr/share/nginx/html;
        index index.html;
    }
}
