server {
    listen 8888;
    server_name localhost;

    server_tokens on;

    # Custom header to distinguish non-standard port probe
    add_header X-Lab-Target "nonstandard-port-8888" always;
    add_header X-Service-Type "Custom-Port-Tester" always;

    location / {
        root /usr/share/nginx/html;
        index index.html;
    }
}
