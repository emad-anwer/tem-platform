server {
    listen 443 ssl;
    server_name target4.lab.local sub1.target4.lab.local api.target4.lab.local admin.internal.tem.local localhost;

    ssl_certificate /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    server_tokens on;

    add_header X-Lab-Target "tls-san-multi-domain" always;

    location / {
        root /usr/share/nginx/html;
        index index.html;
    }
}
