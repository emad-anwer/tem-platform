[project]
name = "tem-platform"
version = "0.1.0"
description = "Modular monolith platform scaffold"
readme = "README.md"
authors = [
    { name = "Zyad Mohamed" },
    { name = "Islam Abdelslam" },
    { name = "Tasneem Mohamed" },
    { name = "Arwa Hazem" }
]
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.19.1",
    # arq: async job queue on Redis, approved in DECISIONS.md §4.  Scanning and
    # feed ingestion cannot run in request handlers; arq is async-native (same
    # event-loop model as FastAPI), uses the Redis already in the stack, and is
    # small enough that an intern can read the whole library in an afternoon.
    "arq>=0.26.1",
    "asyncpg>=0.31.0",
    "dnspython>=2.8.0",
    "fastapi>=0.141.1",
    "greenlet>=3.1.4",
    "httpx>=0.28.1",
    "pydantic-settings>=2.15.0",
    "pyjwt[cryptography]>=2.9.0",
    "redis[hiredis]>=5.3.0",
    "sqlalchemy>=2.0.52",
    "structlog>=26.1.0",
    "uvicorn[standard]>=0.52.4",
]

[dependency-groups]
dev = [
    "cryptography>=42.0.0",
    "httpx2>=2.12.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "respx>=0.22.0",
    "ruff>=0.12.0",
]

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "app"

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
ignore = ["B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
pythonpath = ["src", "."]
markers = [
    "e2e: end-to-end tests hitting real dockerized Postgres + Redis (run via `just test`)",
    "live_zitadel: hits a real Zitadel instance; never runs in CI",
    "lab: needs `just lab-up`; runs on the compose network (worker view)",
    "lab_host: needs `just lab-up`; runs against 127.0.0.1 published ports",
]