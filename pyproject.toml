[project]
name = "tem-platform"
version = "0.1.0"
description = "Modular monolith platform scaffold"
readme = "README.md"
authors = [
    { name = "Zyad Mohamed" },
    { name = "Islam Abdelslam" },
    { name = "Tasneem Mohamed" },
    { name = "Arwa Hazem" }
]
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.19.1",
    "asyncpg>=0.31.0",
    "fastapi>=0.141.1",
    "pydantic-settings>=2.15.0",
    "sqlalchemy>=2.0.52",
    "uvicorn[standard]>=0.52.4",
]

[dependency-groups]
dev = [
    "ruff>=0.12.0",
]

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "app"

[tool.ruff]
target-version = "py311"
line-length = 88
